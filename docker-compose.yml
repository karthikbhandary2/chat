services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: chat
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: chat
    ports: ["25433:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]

  app:
    build: .
    environment:
      DB_URL: postgres://chat:secret@postgres:5432/chat?sslmode=disable
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: ${JWT_SECRET}
    ports: ["8082:8082"]
    depends_on: [postgres, redis]

volumes:
  pgdata: