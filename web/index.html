<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>WebSocket Test Client</title>
  <style>
    body { font-family: monospace; max-width: 700px; margin: 40px auto; padding: 0 16px; background:#1e1e1e; color:#ddd; }
    h2 { color: #fff; }
    #log { border: 1px solid #444; height: 300px; overflow-y: auto; padding: 8px; margin-bottom: 12px; background: #111; }
    #log div { margin-bottom: 4px; }
    .sent { color: #4da3ff; }
    .received { color: #4caf50; }
    .system { color: #888; font-style: italic; }
    .error { color: #e05555; }
    input { padding: 6px; background:#2a2a2a; border:1px solid #444; color:#eee; }
    #token { width: 100%; margin-bottom: 8px; box-sizing: border-box; }
    .row { display: flex; gap: 8px; margin-bottom: 8px; }
    #conversation { width: 260px; }
    #message { flex: 1; }
    button { padding: 6px 12px; background:#2a2a2a; color:#eee; border:1px solid #555; cursor:pointer; }
    button:disabled { opacity: 0.5; cursor: default; }
    label { font-size: 12px; color: #999; display:block; margin-bottom:2px; }
  </style>
</head>
<body>
  <h2>WebSocket Test Client</h2>

  <label>JWT token</label>
  <input type="text" id="token" placeholder="Paste JWT token here" />

  <div class="row">
    <button id="connectBtn">Connect</button>
    <button id="disconnectBtn" disabled>Disconnect</button>
  </div>

  <div id="log"></div>

  <label>Conversation ID (UUID)</label>
  <div class="row">
    <input type="text" id="conversation" placeholder="conversation_id (UUID)" disabled />
  </div>

  <label>Message</label>
  <div class="row">
    <input type="text" id="message" placeholder="Type a message" disabled />
    <button id="sendBtn" disabled>Send</button>
  </div>

  <script>
    let ws = null;
    const log = document.getElementById('log');
    const tokenInput = document.getElementById('token');
    const conversationInput = document.getElementById('conversation');
    const messageInput = document.getElementById('message');
    const connectBtn = document.getElementById('connectBtn');
    const disconnectBtn = document.getElementById('disconnectBtn');
    const sendBtn = document.getElementById('sendBtn');

    function addLog(text, className) {
      const div = document.createElement('div');
      div.textContent = text;
      div.className = className;
      log.appendChild(div);
      log.scrollTop = log.scrollHeight;
    }

    connectBtn.addEventListener('click', () => {
      const token = tokenInput.value.trim();
      if (!token) {
        alert('Paste a token first');
        return;
      }

      const wsUrl = `ws://localhost:8082/ws?token=${encodeURIComponent(token)}`;
      ws = new WebSocket(wsUrl);

      ws.onopen = () => {
        addLog('[connected]', 'system');
        connectBtn.disabled = true;
        disconnectBtn.disabled = false;
        conversationInput.disabled = false;
        messageInput.disabled = false;
        sendBtn.disabled = false;
      };

      ws.onmessage = (event) => {
        addLog('received: ' + event.data, 'received');
      };

      ws.onclose = (event) => {
        addLog(`[closed] code=${event.code} reason=${event.reason || '(none)'}`, 'system');
        resetButtons();
      };

      ws.onerror = (event) => {
        addLog('[error] see browser console for details', 'error');
        console.error('WebSocket error:', event);
      };
    });

    disconnectBtn.addEventListener('click', () => {
      if (ws) ws.close();
    });

    sendBtn.addEventListener('click', sendMessage);
    messageInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') sendMessage();
    });

    function sendMessage() {
      const conversationId = conversationInput.value.trim();
      const text = messageInput.value.trim();

      if (!conversationId) {
        alert('Enter a conversation ID first');
        return;
      }
      if (!text || !ws || ws.readyState !== WebSocket.OPEN) return;

      const payload = JSON.stringify({
        conversation_id: conversationId,
        content: text
      });

      ws.send(payload);
      addLog('sent -> conversation ' + conversationId + ': ' + text, 'sent');
      messageInput.value = '';
    }

    function resetButtons() {
      connectBtn.disabled = false;
      disconnectBtn.disabled = true;
      conversationInput.disabled = true;
      messageInput.disabled = true;
      sendBtn.disabled = true;
    }
  </script>
</body>
</html>
